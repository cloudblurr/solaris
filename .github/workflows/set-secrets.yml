name: Set Deployment Secrets (Run Once)

# Run this workflow manually from GitHub Actions UI
# Go to: Actions → Set Deployment Secrets → Run workflow
# Paste your GitHub PAT when prompted

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to confirm setting secrets from repository variables"
        required: true
        default: "no"

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}
    steps:
      - name: Secrets are set via repository settings
        run: |
          echo "To set secrets, go to:"
          echo "  https://github.com/cloudblurr/NimbusAI/settings/secrets/actions"
          echo ""
          echo "Add these secrets:"
          echo "  CLOUDFLARE_ACCOUNT_ID"
          echo "  CLOUDFLARE_CONTAINER_API_ACCOUNT_TOKEN"
          echo "  NEXTAUTH_SECRET"
          echo "  DATABASE_URL"
          echo "  DIGITAL_OCEAN_API_TOKEN"
          echo "  DIGITAL_OCEAN_AI_ENDPOINT"
          echo "  GOOGLE_CLIENT_ID"
          echo "  GOOGLE_CLIENT_SECRET"
          echo "  NEXTAUTH_URL = https://sol.terragravity.cloud"
